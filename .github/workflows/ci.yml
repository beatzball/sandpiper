name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl
      - run: cargo fmt --all --check
      # clippy and check do not link, so sandpiper-vmm is covered here even
      # though libkrun is not installed on the runner.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test builds that open walls on purpose still lint
        run: cargo clippy -p sandpiper-vmm -p sandpiperd --features sandpiper-vmm/wall-tests,sandpiperd/wall-tests --all-targets -- -D warnings
      - run: cargo test --workspace --exclude sandpiper-vmm
      - name: Guest agent builds for both Linux architectures
        run: |
          for t in aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            cargo clippy -p sandpiper-guest --target "$t" -- -D warnings
            cargo build --release -p sandpiper-guest --target "$t"
          done
      - run: scripts/check-crate-pii.sh sandpiper

  # Links and tests the VMM against a real libkrun. Runners have no KVM, so
  # no VM boots here; scripts/m1-smoke.sh covers that on a KVM host.
  vmm:
    runs-on: ubuntu-latest
    env:
      LIBKRUN_VERSION: v1.19.7
      LIBKRUN_COMMIT: 43b2f5aadeebb90f42053c9df2ec8b16583e554f
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: krun
        with:
          path: ~/krun
          key: libkrun-${{ env.LIBKRUN_COMMIT }}-blk-net-${{ runner.os }}-${{ runner.arch }}
      - name: Build libkrun
        if: steps.krun.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq libclang-dev
          git clone -q --depth 1 -b "$LIBKRUN_VERSION" https://github.com/containers/libkrun.git /tmp/libkrun
          test "$(git -C /tmp/libkrun rev-parse HEAD)" = "$LIBKRUN_COMMIT"
          make -C /tmp/libkrun BLK=1 NET=1 -j"$(nproc)"
          make -C /tmp/libkrun BLK=1 NET=1 install PREFIX="$HOME/krun"
      - name: Build and test the VMM
        run: |
          libdir=$(dirname "$(find ~/krun -name 'libkrun.so' | head -1)")
          export KRUN_LIB_DIR="$libdir" LD_LIBRARY_PATH="$libdir"
          cargo clippy -p sandpiper-vmm --all-targets -- -D warnings
          cargo test -p sandpiper-vmm
