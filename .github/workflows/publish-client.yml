name: publish-client

# Publishes clients/ts to npm as @beatzball/sandpiper-client with provenance.
# Push a tag named client-v<version>, where <version> is the version in
# clients/ts/package.json, for example client-v0.1.0. The tagged commit must
# be on main. The job runs in the `npm` environment; give it a required
# reviewer and limit it to client-v* tags in the repository settings.
on:
  push:
    tags: ['client-v*']

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-client
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # for the ancestor check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - name: The tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "client-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on origin/main"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:pack
      # Build here, then publish with --ignore-scripts, so no build code runs
      # while NODE_AUTH_TOKEN is set.
      - run: npm run build
      - name: Publish
        run: |
          version=$(node -p "require('./package.json').version")
          # A prerelease (0.2.0-rc.1) goes to the next tag, not latest.
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm publish --ignore-scripts --provenance --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
