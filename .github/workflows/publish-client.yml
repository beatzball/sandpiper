name: publish-client

# Publishes clients/ts to npm as @beatzball/sandpiper-client with provenance.
# Push a tag named client-v<version>, where <version> is the version in
# clients/ts/package.json, for example client-v0.1.0.
on:
  push:
    tags: ['client-v*']

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: publish-client
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json
      - name: The tag matches the package version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "client-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:pack
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
