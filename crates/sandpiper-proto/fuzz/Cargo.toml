[package]
name = "sandpiper-proto-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
sandpiper-proto = { path = ".." }

# Not part of the main workspace: it needs a nightly toolchain.
[workspace]
members = ["."]

[[bin]]
name = "read_frame"
path = "fuzz_targets/read_frame.rs"
test = false
doc = false
bench = false
