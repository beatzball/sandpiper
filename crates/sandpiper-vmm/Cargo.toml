[package]
name = "sandpiper-vmm"
version = "0.0.0"
description = "Boots one sandpiper microVM with libkrun. One process per machine."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Test builds only: `boot --break-wall tsi|net` starts a VMM with a wall
# deliberately open, to prove the host agent's wall check catches it.
wall-tests = []

[dependencies]
sandpiper-proto.workspace = true
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
sandpiper-seccomp.workspace = true
